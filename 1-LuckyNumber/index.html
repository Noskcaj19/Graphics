<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Number</title>
  <style>
    * {
      font-family: sans-serif;
      margin: 0;
      padding: 2px;
    }

    main {
      text-align: center;
    }

    table {
      display: inline-block;
      border-collapse: collapse;
    }

    table th,
    table td {
      border: solid 1px !important;
    }

    td[data-win="true"] {
      color: green;
      border-color: black !important;
    }

    td[data-win="false"] {
      color: red;
      border-color: black !important;
    }

    #table-container {
      overflow-y: scroll;
      height: 25vh;
    }

    #current-ratio {
      color: lightgrey;
    }

    #play-game {
      margin: 3px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Lucky Numbers</h1>
    <div id="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Left</th>
            <th>Right</th>
            <th>Win?</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
    <button id="play-game">Play</button>

    <p>
      <span id="winning-display">?</span> - <span id="current-ratio">?</span>
    </p>
    <img id="status-image" />
  </main>

  <script>
    class Main {
      #wins = 0;
      #losses = 0;
      #historyBodyEl = null;
      #winningDisplayEl = null;
      #currentRatioEl = null;
      #statusImageEl = null;

      constructor(historyBodyEl, winningDisplayEl, currentRatioEl, statusImageEl) {
        this.#historyBodyEl = historyBodyEl;
        this.#winningDisplayEl = winningDisplayEl;
        this.#currentRatioEl = currentRatioEl;
        this.#statusImageEl = statusImageEl;
        this.#updateGraphic()
      }

      #createRow(left, right, win) {
        let newRow = this.#historyBodyEl.insertRow(0);
        let cellIndex = newRow.insertCell();
        cellIndex.append(document.createTextNode(this.#wins + this.#losses));
        let cellLeft = newRow.insertCell();
        cellLeft.append(document.createTextNode(left));
        let cellRight = newRow.insertCell();
        cellRight.append(document.createTextNode(right));
        let cellWin = newRow.insertCell();
        let winText = document.createTextNode(win ? "Yes" : "No");
        cellWin.setAttribute("data-win", win);
        cellWin.append(winText);
      }

      get winning() {
        return this.state > 0
      }

      get loosing() {
        return this.state < 0
      }

      get tied() {
        return this.state == 0
      }

      get state() {
        return this.#wins - this.#losses
      }

      #updateGraphic() {
        let ratio = this.#losses > 0 ? (this.#wins / this.#losses).toPrecision(2) : this.#wins
        this.#currentRatioEl.textContent = `${this.#wins} / ${this.#losses} = ${ratio}`;


        if (this.tied) {
          this.#winningDisplayEl.textContent = "Tied"
          this.#statusImageEl.src = balanceImage()
        } else if (this.winning) {
          this.#winningDisplayEl.textContent = "Winning"
          this.#statusImageEl.src = smileyImage()
        } else if (this.loosing) {
          this.#winningDisplayEl.textContent = "Loosing"
          this.#statusImageEl.src = sadImage()
        }
      }

      playGame() {
        let x = Math.trunc(Math.random() * 100) + 1;
        let y = Math.trunc(Math.random() * 100) + 1;

        if (x < y) {
          this.#wins += 1;
        } else {
          this.#losses += 1;
        }

        this.#createRow(x, y, x < y);
        this.#updateGraphic();
      }
    }

    let main;

    (function () {
      let resultHistoryEl = document.getElementById("history-body");
      let winningDisplayEl = document.getElementById("winning-display");
      let currentRatioEl = document.getElementById("current-ratio");
      let statusImageEl = document.getElementById("status-image")

      main = new Main(resultHistoryEl, winningDisplayEl, currentRatioEl, statusImageEl);

      document
        .getElementById("play-game")
        .addEventListener("click", () => main.playGame());
    })();
