<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slots</title>
  <style>
    * {
      font-family: sans-serif;
      margin: 0;
      padding: 2px;
    }

    main {
      text-align: center;
    }

    .inline {
      display: inline-block;
    }

    #play-game {
      margin: 3px;
    }
  </style>
</head>

<body>
  <main>
    <div id="root"></div>
  </main>
  <script>
    function _() { }
    _.range = function range(startAt, size) {
      if (size) return [...Array(size - startAt).keys()].map(i => i + startAt);
      return [...Array(startAt).keys()];
    }
    _.randInt = (x, y) => Math.trunc(Math.random() * y) + 1 + x

    function $(selector) {
      selector = parseElement(selector)[0]
      let el
      if (selector.name) {
        el = document.getElementsByTagName(selector.name)
      } else if (selector.id) {
        el = document.getElementById(selector.id)
      } else if (selector.className) {
        el = document.getElementsByClassName(selector.className)
      }
      if (!el) return
      Object.assign(el, {
        extend: function (children) { children.forEach(c => this.appendChild(c)) }
      })
      return el
    }

    function parseName(str) {
      let result = /^[A-z0-9-]+/du.exec(str);

      if (result == null) {
        return [null, str];
      }

      return [result[0], str.substring(result.indices[0][1])];
    }

    function parseText(str) {
      let result = /^\{([^}]+)\}/du.exec(str);

      if (result == null) {
        return [null, str];
      }

      return [result[1], str.substring(result.indices[0][1])];
    }

    function parseIdOrClass(str) {
      let result = /^(?:\.|#)([A-z-]+)/du.exec(str);

      if (result == null) {
        return [null, str];
      }

      return [{
        type: result[0][0] === "." ? "class" : "id",
        ident: result[1],
      }, str.substring(result.indices[1][1])];
    }

    function parseMultiplicity(str) {
      let result = /^\*(\d+)/du.exec(str);

      if (result == null) {
        return [null, str];
      }

      return [parseInt(result[1]), str.substring(result.indices[0][1])];
    }

    function parseAll(str, parsers) {
      let results = {}
      for (let parser of parsers) {
        var [data, str] = parser(str)

        if (data !== null) {
          let {
            type, ident
          } = data
          Object.assign(results, {
            [type]: ident
          })
        }
      }
      return [results, str]
    }

    function parseOptionalIdAndClass(str) {
      return parseAll(str, [parseIdOrClass, parseIdOrClass])
    }

    function parseElement(str) {
      var [name, str] = parseName(str)
      var [{ id, class: className }, str] = parseOptionalIdAndClass(str)
      var [text, str] = parseText(str)
      var [multiplicity, str] = parseMultiplicity(str)

      return [{ name, id, className, text, multiplicity }, str]
    }

    function h(elDescriptor, attrs, children) {
      if (typeof attrs == "string") {
        children = [attrs]
        attrs = {}
      }
      if (!children && attrs instanceof Array) {
        children = attrs
        attrs = {}
      }
      attrs = attrs || {}
      let { name, id, className, text, multiplicity } = parseElement(elDescriptor)[0]
      let el = document.createElement(name)
      if (id) el.setAttribute("id", id)
      if (className) el.setAttribute("class", className)
      if (text) { el.appendChild(document.createTextNode(text)) }

      for (let [attr, val] of Object.entries(attrs)) {
        if (attr.startsWith("on")) {
          el.addEventListener(attr.substr(2), val)
          continue
        }
        el.setAttribute(attr, val)
      }

      for (let child of (children || [])) {
        if (typeof child == "string") { child = document.createTextNode(child) }
        el.appendChild(child)
      }

      if (multiplicity) el = _.range(multiplicity).map(_ => el.cloneNode(true))

      return el
    }
  </script>

    ].map(svg => URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' })))

    class SlotMachine {
      lastWon = 0
      numbers = [0, 0, 0]
      #imgEls = []

      constructor(el) {
        this.#imgEls = h("img.slot-image*3", { src: IMAGES[0], width: 64, height: 64, "data-idx": 0 })
        el.appendChild(h("div.slot-machine", this.#imgEls))
      }

      setImage(elIdx, imgIdx) {
        this.#imgEls[elIdx].src = IMAGES[imgIdx]
        this.#imgEls[elIdx].alt = imgIdx
        this.#imgEls[elIdx].dataset["idx"] = imgIdx
      }

      getImage(elIdx) {
        return parseInt(this.#imgEls[elIdx].dataset["idx"])
      }

      scrollImgTo(elIdx, endingIdx, cb) {
        let iterations = _.randInt(4, 15)
        let time = 60
        let startingIdx = this.getImage(elIdx)
        for (let i in _.range(iterations)) {
          setTimeout(() => {
            this.setImage(elIdx, (startingIdx + i) % 7)
          }, i * time)
        }
        setTimeout(() => { this.setImage(elIdx, endingIdx) }, (iterations + 1) * time)
      }

      play() {
        this.numbers = _.range(3).map(i => _.randInt(0, 6));
        this.numbers.map((imgIdx, elIdx) => this.scrollImgTo(elIdx, imgIdx))
        this.lastWon = this.calcScore()
        return this.lastWon
      }

      calcScore() {
        let n = this.numbers
        if (n[0] == 0 && n[1] == 0 && n[2] == 0) {
          return 14
        } else if (n[0] == n[1] && n[1] == n[2]) {
          return 7
        } else if (n[0] == 0 && n[1] == 0 && n[2] != 0) {
          return 3
        } else if (n[0] == n[1] && n[0] != 0) {
          return 2
        } else if (n[0] == 0) {
          return 1
        } else {
          return 0
        }
      }

      remove() {
        this.#imgEls[0].parentElement.remove()
      }
    }

    class Main {
      #money = 100
      #machines = []
      #moneyEl = null
      #winningEl = null

      constructor() {
        $("#root").extend([
          h("h1#money-header", [
            "Money: $",
            this.#moneyEl = h("span", `${this.#money}`)
          ]),
          h("button#play-game{Play}", { onclick: () => this.playAll() }),
          this.#winningEl = h("h3"),
          h("div#slot-container"),
          h("button{+}", { onclick: () => this.#machines.push(new SlotMachine($("#slot-container"))) }),
          h("button{-}", { onclick: () => this.#machines.pop().remove() }),
        ])
        _.range(3).forEach(x => this.#machines.push(new SlotMachine($("#slot-container"))))
      }

      get machines() {
        return this.#machines
      }

      displayWinner(winnings) {
        this.#winningEl.innerText = `Winning \$${winnings}`
      }

      displayLost() {
        this.#winningEl.innerText = "Game over"
      }

      playAll() {
        if (this.#money <= 0) {
          return
        }
        this.#money -= 1;
        this.#moneyEl.innerText = `${this.#money}`
        let scores = this.#machines.map(machine => machine.play())
        let sum = scores.reduce((partial, x) => partial + x, 0)
        if (sum > 0) {
          this.displayWinner(sum)
        } else {
          this.displayLost()
        }
        this.#money += sum
      }
    }

    let main = new Main()
  </script>
